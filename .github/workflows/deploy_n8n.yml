name: Deploy n8n Workflows

on:
  push:
    paths:
      - 'server/n8n/**.json'
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Workflows to n8n
        env:
          N8N_HOST: ${{ secrets.N8N_HOST }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_PROTOCOL: https
        run: |
          # Install jq if needed (usually pre-installed on ubuntu-latest)
          sudo apt-get install -y jq

          cd server/n8n

          for file in *.json; do
            echo "Processing $file..."
            
            # 1. Extract Name from JSON
            WORKFLOW_NAME=$(jq -r '.name' "$file")
            echo "Workflow Name: $WORKFLOW_NAME"
            
            # 2. Check if Workflow exists in n8n
            EXISTING_ID=$(curl -s "$N8N_PROTOCOL://$N8N_HOST/api/v1/workflows" \
              -H "X-N8N-API-KEY: $N8N_API_KEY" | \
              jq -r --arg name "$WORKFLOW_NAME" '.data[] | select(.name == $name) | .id')
            
            if [ -n "$EXISTING_ID" ]; then
              echo "Found existing workflow ID: $EXISTING_ID. Updating..."
              
              # Update (PUT)
              # curl requires the ID in the URL and the body
              curl -s -X PUT "$N8N_PROTOCOL://$N8N_HOST/api/v1/workflows/$EXISTING_ID" \
                -H "X-N8N-API-KEY: $N8N_API_KEY" \
                -H "Content-Type: application/json" \
                -d @"$file"
            else
              echo "Workflow not found. Creating..."
              
              # Create (POST)
              curl -s -X POST "$N8N_PROTOCOL://$N8N_HOST/api/v1/workflows" \
                -H "X-N8N-API-KEY: $N8N_API_KEY" \
                -H "Content-Type: application/json" \
                -d @"$file"
            fi
            echo "--------------------------------"
          done
